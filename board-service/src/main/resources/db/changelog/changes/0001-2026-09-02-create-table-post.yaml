databaseChangeLog:
  - changeSet:
      id: 1
      author: Aleksandr Yarkovskiy

      changes:
        - createTable:
            tableName: post
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(200)
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: post
            columnNames: id
            constraintName: pk_post