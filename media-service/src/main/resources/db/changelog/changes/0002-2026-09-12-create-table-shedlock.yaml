databaseChangeLog:
  - changeSet:
      id: 2
      author: Aleksandr Yarkovskiy
      changes:
        - createTable:
            tableName: shedlock
            columns:
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: locked_by
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: locked_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: lock_until
                  type: timestamptz
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: shedlock
            columnNames: name
            constraintName: pk_shedlock