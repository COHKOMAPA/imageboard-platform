databaseChangeLog:
  - changeSet:
      id: 1
      author: Aleksandr Yarkovskiy
      changes:
        - createTable:
            tableName: media
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: object_key
                  type: varchar(1024)
                  constraints:
                    nullable: false
              - column:
                  name: original_file_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: size
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: staus
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: media
            columnNames: id
            constraintName: pk_media

        - addUniqueConstraint:
            tableName: media
            columnNames: object_key
            constraintName: uk_media_object_key