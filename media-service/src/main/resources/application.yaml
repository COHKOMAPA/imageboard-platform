spring:
  application:
    name: media-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${MEDIA_DB_NAME}
    username: ${MEDIA_DB_USER}
    password: ${MEDIA_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    database-platform:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml